site_name: ESPuino-Handbuch
site_description: >-
  Handbuch für den ESPuino – RFID-gesteuerter Audio-Player. Fokus auf die
  Complete-Platine (mini4L als Vorgänger).
site_author: biologist79
# Beim Anlegen des GitHub-Repos ggf. anpassen:
site_url: https://biologist79.github.io/ESPuino-Docs/
repo_url: https://github.com/biologist79/ESPuino-Docs
repo_name: ESPuino-Docs
edit_uri: edit/main/docs/
copyright: © biologist79 · ESPuino

theme:
  name: material
  custom_dir: overrides
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  icon:
    repo: fontawesome/brands/github

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lang-redirect.js

# Mehrsprachigkeit: Deutsch ist die Default-Sprache (die vorhandenen .md-Dateien),
# EN/FR liegen als seite.en.md / seite.fr.md daneben. Kommt ein neues deutsches
# Kapitel dazu, zieht die Übersetzung erstmal automatisch nach (fallback_to_default) –
# die passende seite.en.md / seite.fr.md sollte aber zeitnah ergänzt werden.
plugins:
  - search:
      lang: [de, en, fr]
  - glightbox
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          site_name: ESPuino Handbook
          site_description: >-
            Handbook for ESPuino – the RFID-controlled audio player. Focus on the Complete board
            (mini4L as predecessor).
          nav_translations:
            Start: Home
            "Teil 1 · Einstieg": "Part 1 · Getting started"
            "1 · Was ist ESPuino?": "1 · What is ESPuino?"
            "2 · Quickstart": "2 · Quickstart"
            "Teil 2 · Hardware (Complete)": "Part 2 · Hardware (Complete)"
            "3 · Die Complete-Platine": "3 · The Complete board"
            "4 · Der Akku": "4 · The battery"
            "5 · Anschließen": "5 · Wiring it up"
            "6 · Das Gehäuse": "6 · The enclosure"
            "Teil 3 · Inbetriebnahme": "Part 3 · First setup"
            "7 · Erststart": "7 · First start"
            "Teil 4 · Bedienung": "Part 4 · Operation"
            "8 · Das Webinterface": "8 · The web interface"
            "9 · Bedienung am Gerät": "9 · Operation at the device"
            "Teil 5 · Inhalte": "Part 5 · Content"
            "10 · Inhalte verwalten": "10 · Managing content"
            "11 · MediaHub": "11 · MediaHub"
            "Teil 6 · Vertiefung": "Part 6 · Deep dive"
            "12 · Erweiterte Themen": "12 · Advanced topics"
            "Teil 7 · Firmware & Build": "Part 7 · Firmware & build"
            "13 · Firmware aktualisieren": "13 · Updating the firmware"
            "14 · Compile-Zeit-Konfiguration": "14 · Compile-time configuration"
            "Teil 8 · Hilfe": "Part 8 · Help"
            "15 · Troubleshooting": "15 · Troubleshooting"
            "Teil 9 · Referenz & Legacy": "Part 9 · Reference & legacy"
            "16 · Bestandsgeräte: mini4L": "16 · Existing devices: mini4L"
            "17 · Entwicklung & Beitrag": "17 · Development & contributing"
            "18 · Anhang": "18 · Appendix"
        - locale: fr
          name: Français
          build: true
          site_name: Manuel ESPuino
          site_description: >-
            Manuel d'ESPuino – le lecteur audio piloté par RFID. Axé sur la carte Complete
            (mini4L comme prédécesseur).
          nav_translations:
            Start: Accueil
            "Teil 1 · Einstieg": "Partie 1 · Prise en main"
            "1 · Was ist ESPuino?": "1 · Qu'est-ce qu'ESPuino ?"
            "2 · Quickstart": "2 · Démarrage rapide"
            "Teil 2 · Hardware (Complete)": "Partie 2 · Matériel (Complete)"
            "3 · Die Complete-Platine": "3 · La carte Complete"
            "4 · Der Akku": "4 · La batterie"
            "5 · Anschließen": "5 · Câblage"
            "6 · Das Gehäuse": "6 · Le boîtier"
            "Teil 3 · Inbetriebnahme": "Partie 3 · Mise en service"
            "7 · Erststart": "7 · Premier démarrage"
            "Teil 4 · Bedienung": "Partie 4 · Utilisation"
            "8 · Das Webinterface": "8 · L'interface web"
            "9 · Bedienung am Gerät": "9 · Utilisation sur l'appareil"
            "Teil 5 · Inhalte": "Partie 5 · Contenus"
            "10 · Inhalte verwalten": "10 · Gérer les contenus"
            "11 · MediaHub": "11 · MediaHub"
            "Teil 6 · Vertiefung": "Partie 6 · Approfondissement"
            "12 · Erweiterte Themen": "12 · Sujets avancés"
            "Teil 7 · Firmware & Build": "Partie 7 · Firmware et compilation"
            "13 · Firmware aktualisieren": "13 · Mettre à jour le firmware"
            "14 · Compile-Zeit-Konfiguration": "14 · Configuration à la compilation"
            "Teil 8 · Hilfe": "Partie 8 · Aide"
            "15 · Troubleshooting": "15 · Dépannage"
            "Teil 9 · Referenz & Legacy": "Partie 9 · Référence et héritage"
            "16 · Bestandsgeräte: mini4L": "16 · Appareils existants : mini4L"
            "17 · Entwicklung & Beitrag": "17 · Développement et contribution"
            "18 · Anhang": "18 · Annexe"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/solid/comments
      link: https://forum.espuino.de
      name: ESPuino-Forum

nav:
  - Start: index.md
  - "Teil 1 · Einstieg":
      - "1 · Was ist ESPuino?": einstieg/was-ist-espuino.md
      - "2 · Quickstart": einstieg/quickstart.md
  - "Teil 2 · Hardware (Complete)":
      - "3 · Die Complete-Platine": hardware/complete.md
      - "4 · Der Akku": hardware/akku.md
      - "5 · Anschließen": hardware/aufbau.md
      - "6 · Das Gehäuse": hardware/gehaeuse.md
  - "Teil 3 · Inbetriebnahme":
      - "7 · Erststart": inbetriebnahme/erststart.md
  - "Teil 4 · Bedienung":
      - "8 · Das Webinterface": bedienung/webinterface.md
      - "9 · Bedienung am Gerät": bedienung/am-geraet.md
  - "Teil 5 · Inhalte":
      - "10 · Inhalte verwalten": inhalte/verwalten.md
      - "11 · MediaHub": inhalte/mediahub.md
  - "Teil 6 · Vertiefung":
      - "12 · Erweiterte Themen": vertiefung/erweiterte-themen.md
  - "Teil 7 · Firmware & Build":
      - "13 · Firmware aktualisieren": firmware/aktualisieren.md
      - "14 · Compile-Zeit-Konfiguration": firmware/compile-zeit.md
  - "Teil 8 · Hilfe":
      - "15 · Troubleshooting": hilfe/troubleshooting.md
  - "Teil 9 · Referenz & Legacy":
      - "16 · Bestandsgeräte: mini4L": referenz/mini4l.md
      - "17 · Entwicklung & Beitrag": referenz/entwicklung.md
      - "18 · Anhang": referenz/anhang.md
